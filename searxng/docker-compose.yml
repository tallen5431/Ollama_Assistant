# A private SearXNG for this app to search through.
#
# SearXNG queries the engines on your behalf and hands back JSON, so the app
# never scrapes anyone's HTML — which is what stopped working when DuckDuckGo
# started serving a "confirm you are a human" challenge to the box's address.
#
#   cd searxng
#   mkdir -p config && cp settings.yml.example config/settings.yml
#   sed -i "s|ultrasecretkey|$(python3 -c 'import secrets;print(secrets.token_hex(32))')|" config/settings.yml
#   docker compose up -d
#
# Then set SEARXNG_URL=http://127.0.0.1:8888 for the chat app and restart it.
#
# `docker compose` is the v2 plugin and Ubuntu's docker.io package ships
# without it — "unknown shorthand flag: 'd' in -d" is what that looks like,
# because the -d never reaches a compose that would understand it.
#
# The hyphenated `docker-compose` is NOT the answer: that is v1, end-of-life
# since 2023, and against a current Docker Engine it dies on the recreate path
# with KeyError: 'ContainerConfig' — Docker stopped emitting that field in
# image inspect and v1 reads it unconditionally. Nothing in this file causes it
# and nothing in this file can avoid it. Install docker-compose-v2, or run the
# container directly; the README spells out the equivalent docker run, which
# needs nothing but docker.

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Bound to loopback on purpose: this instance is for the app on this
    # machine, and an open SearXNG is something other people will find and
    # use. Tailscale is how you reach the box; nothing here needs to be on it.
    ports:
      - "127.0.0.1:8888:8080"
    # ./config, not ./ — and this is not cosmetic. The container chowns
    # whatever it is given to its own user, which is what the CHOWN capability
    # below is for. Handed the checkout, it took ownership of a directory git
    # manages: `git pull` then failed with "unable to unlink old
    # searxng/settings.yml", and `sed -i` with "couldn't open temporary file",
    # on a box where nothing had gone wrong. config/ is gitignored, so the
    # container owns only what it is entitled to own.
    #
    # Create it from the example alongside this file — see the README.
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # It is a search proxy, not a database. Without this the json log grows
    # until something else on the box runs out of room.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
